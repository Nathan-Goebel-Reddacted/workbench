name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Une exécution par branche : un push qui suit de près annule le précédent au lieu de faire
# la queue, sauf sur main où il attend — annuler couperait un déploiement en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` et non `npm install` : le lock fait foi, et une dérive de dépendance échoue
      # ici plutôt que de s'installer en silence.
      - run: npm ci

      - name: Formatage
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Aucun service Postgres : cette suite ne couvre que du domaine et des fonctions pures.
      # Le jour où un test aura besoin d'une base, il faudra ajouter un service ici — pas le
      # rendre optionnel.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}

    steps:
      - name: Clé SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Déploiement
        run: >-
          ssh -i ~/.ssh/deploy
          -o IdentitiesOnly=yes -o BatchMode=yes
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts
          -o ServerAliveInterval=30
          "nathan@$DEPLOY_HOST" "$GITHUB_SHA"

      - name: Santé
        run: curl -fsS --max-time 10 --retry 5 --retry-delay 5 "$DEPLOY_URL/api/health"
