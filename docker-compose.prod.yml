# Pile de production : `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build`
#
# Le fichier de base sert le développement (backend en tsx, fronts lancés par Vite hors
# Docker). Celui-ci bascule le backend sur son image compilée et ajoute le nginx qui sert
# les deux fronts sous une origine unique.

services:
  # Docker écrit ses propres règles iptables : un port publié ici est joignable depuis
  # Internet, quoi qu'en dise ufw. La base ne parle qu'au backend, par le réseau compose.
  postgres:
    ports: !reset []

  backend:
    build:
      target: prod
    # Le port n'est plus publié : seul nginx atteint le backend, via le réseau compose.
    ports: !reset []
    # !override, pas une fusion : le bind du fichier de base monte les sources de l'hôte
    # par-dessus l'image compilée, ce qui n'a aucun sens ici.
    volumes: !override
      - uploads_data:/app/packages/backend/uploads
      - ./ioPort:/app/ioPort
      - ./backup:/app/backup
    env_file: !reset []
    environment:
      JWT_SECRET:
      SESSION_TTL:
      APP_URL:
      FRONTEND_PUBLIC_URL:
      FRONTEND_PRIVATE_URL:
      BOOTSTRAP_ADMIN_EMAIL:
      GITHUB_CLIENT_ID:
      GITHUB_CLIENT_SECRET:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:
      POSTGRES_PORT:
      PORT:
      HOST:
      LOG_LEVEL:
      CONTACT_MAIL_TO:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASS:
      SMTP_FROM:
      NODE_ENV: production
      PG_TOOLS: direct
      # Les maps `environment` fusionnent d'un fichier à l'autre : sans cette ligne, le
      # `'true'` du fichier de base survit ici et le cookie de session part sans `Secure`.
      ALLOW_INSECURE_COOKIE: 'false'
      # Le .env porte la valeur de développement (localhost) ; dans le réseau compose la
      # base répond sur le nom du service.
      POSTGRES_HOST: postgres
    restart: unless-stopped
    healthcheck:
      # /health vérifie aussi la base : un backend qui ne la joint plus n'est pas sain.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: prod
      args:
        # Vite fige ces valeurs dans le bundle : elles doivent porter l'origine publique
        # réelle, pas un nom de service compose.
        VITE_API_URL: ${VITE_API_URL}
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL}
    # Caddy est désormais la seule porte d'entrée : nginx ne se joint que par le
    # réseau compose.
    ports: !reset []
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Terminaison TLS. Sans elle le cookie de session, `secure` en production, ne
  # s'établit jamais : l'espace privé reste inaccessible.
  caddy:
    image: caddy:2-alpine
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats vivent ici : sans ce volume, chaque redémarrage en redemande un
      # à Let's Encrypt et finit par heurter ses quotas.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    depends_on:
      - web
    restart: unless-stopped

volumes:
  uploads_data:
  caddy_data:
  caddy_config:
