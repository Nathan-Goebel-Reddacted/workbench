server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aligné sur MAX_UPLOAD_BYTES (uploadRoutes.ts) : sans ça nginx renvoie 413
    # avant même que Fastify voie la requête.
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /.env {
        default_type text/plain;
        return 200 "la paix c'est le respect du droit des autre\n";
    }

    # ── API ──────────────────────────────────────────────────────────────────
    # Sur une adresse littérale, nginx résout son upstream une seule fois, au démarrage :
    # un backend absent l'empêche de démarrer, et un backend recréé lui laisse une IP
    # périmée. Passer par une variable diffère la résolution à chaque requête, par le
    # resolver interne de Docker.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream backend:3000;

        # Avec une variable, le / final de proxy_pass ne retire plus le préfixe : le
        # rewrite s'en charge. Le backend continue de servir /portfolio, /auth/*,
        # /uploads/* aux mêmes chemins qu'en dev.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un import de base ou un upload de vidéo dépasse largement le défaut de 60 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Le MCP a sa propre entrée, /mcp : il n'est plus joignable sous /api.
    location /api/mcp {
        return 404;
    }

    # ── MCP ──────────────────────────────────────────────────────────────────
    # /mcp, /mcp/pair et /mcp/pair/claim, transmis tels quels. Le transport
    # Streamable HTTP peut répondre en SSE : sans buffering, chaque événement part
    # dès qu'il est écrit.
    location /mcp {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream backend:3000;

        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── espace privé ─────────────────────────────────────────────────────────
    location = /admin { return 301 /admin/; }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ── site public ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les noms des bundles Vite portent un hash : ils sont immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
