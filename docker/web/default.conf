server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aligné sur MAX_UPLOAD_BYTES (uploadRoutes.ts) : sans ça nginx renvoie 413
    # avant même que Fastify voie la requête.
    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ──────────────────────────────────────────────────────────────────
    # Le / final de proxy_pass retire le préfixe /api : le backend continue de
    # servir /portfolio, /auth/*, /uploads/*, /mcp aux mêmes chemins qu'en dev.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un import de base ou un upload de vidéo dépasse largement le défaut de 60 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── espace privé ─────────────────────────────────────────────────────────
    location = /admin { return 301 /admin/; }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ── site public ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les noms des bundles Vite portent un hash : ils sont immuables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
