name: workbench

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: dev
    ports:
      - '3000:3000'
    volumes:
      - ./packages/backend/src:/app/packages/backend/src
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Développement local en HTTP : sans cela le cookie `secure` n'est jamais posé.
      # docker-compose.prod.yml ne définit pas cette variable — le cookie y reste secure.
      ALLOW_INSECURE_COOKIE: 'true'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
